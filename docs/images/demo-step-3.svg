<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Product demo step 3: receive completion and continue the same task</title>
  <desc id="desc">A representative Feishu completion card shows a successful Codex result and a follow-up message using sample data.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1"><stop offset="0" stop-color="#f5f7fb"/><stop offset="1" stop-color="#edf2ff"/></linearGradient>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#e8f8ec"/><stop offset="1" stop-color="#ddf4e5"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748b" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#page)"/>
  <rect width="1200" height="76" rx="28" fill="#111827"/><rect y="48" width="1200" height="28" fill="#111827"/>
  <circle cx="44" cy="38" r="14" fill="#4f7cff"/>
  <text x="72" y="47" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" font-weight="700">Feishu Codex Bridge · 飞书私聊</text>
  <rect x="962" y="21" width="204" height="36" rx="18" fill="#1e293b"/>
  <text x="1064" y="45" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">DEMO · 示例数据</text>
  <text x="54" y="119" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="600">STEP 3 · GET THE RESULT AND CONTINUE / 收到结果并继续</text>
  <rect x="52" y="143" width="960" height="408" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="52" y="143" width="960" height="108" rx="24" fill="url(#head)"/><rect x="52" y="227" width="960" height="24" fill="url(#head)"/>
  <circle cx="99" cy="191" r="21" fill="#16a34a"/>
  <path d="M89 191l7 7 14-16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="194" fill="#15803d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="28" font-weight="750">任务已完成</text>
  <rect x="326" y="167" width="84" height="34" rx="10" fill="#bde8c8"/>
  <text x="368" y="190" text-anchor="middle" fill="#15803d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700">成功</text>
  <text x="138" y="229" fill="#3f8252" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">demo-project · 总耗时 3 分 18 秒</text>
  <text x="84" y="296" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" font-weight="750">执行结果</text>
  <text x="84" y="334" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">已定位缓存键未包含用户维度，补充失效逻辑并增加边界测试。</text>
  <rect x="84" y="368" width="420" height="76" rx="14" fill="#f0fdf4"/>
  <text x="108" y="398" fill="#166534" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="700">验证</text>
  <text x="108" y="426" fill="#166534" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">12 tests passed · 2 files changed</text>
  <rect x="528" y="368" width="442" height="76" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="552" y="398" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="700">修改文件</text>
  <text x="552" y="426" fill="#475569" font-family="SFMono-Regular,Consolas,monospace" font-size="15">src/cache.mjs · test/cache.test.mjs</text>
  <rect x="84" y="470" width="430" height="58" rx="12" fill="#2563eb"/>
  <text x="299" y="507" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" font-weight="700">继续任务</text>
  <rect x="536" y="470" width="434" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="753" y="507" text-anchor="middle" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" font-weight="700">返回任务列表</text>
  <rect x="542" y="580" width="598" height="82" rx="22" fill="#dbeafe"/>
  <text x="574" y="630" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22">继续1 再补一个并发场景的回归测试</text>
  <circle cx="1158" cy="621" r="22" fill="#2563eb"/>
</svg>
